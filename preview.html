<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Style Preview</title>

<style>

body{
background:#0f1728;
color:white;
font-family:Georgia,serif;
max-width:900px;
margin:auto;
padding:40px;
line-height:1.8;
}

/* Paste any style here */

.light-panel{
height:300px;
margin:50px 0;
border-radius:20px;
position:relative;
overflow:hidden;

background:
radial-gradient(
circle at center,
rgba(231,200,134,.6) 0%,
rgba(231,200,134,.2) 25%,
transparent 70%
),
linear-gradient(
180deg,
#1f2d4a,
#0f1728);
}

.light-panel::before{
content:"";
position:absolute;
inset:0;

background:
radial-gradient(
circle,
rgba(255,255,255,.25) 1px,
transparent 2px);

background-size:40px 40px;
opacity:.4;
}

</style>
</head>
<body>

<h1>Fear Before Fear</h1>

<p>
Fear often begins before we recognize fear.
</p>

<div class="light-panel"></div>

<p>
Sometimes anxiety starts as a thought, a memory, or a possibility.
</p>

</body>
</html>
